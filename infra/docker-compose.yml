# CryptoShop — Beispiel-Deployment für einen gehärteten Single-VPS.
# Aufruf aus dem Repo-Root: docker compose -f infra/docker-compose.yml --env-file .env up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks: [internal]

  frontend:
    build:
      context: ../frontend
      args:
        PUBLIC_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:3000
      # Runtime-Pin für frontend/src/lib/crypto/pgp.ts. Muss dem tatsächlich
      # ausgelieferten frontend/static/pgp-public-key.asc entsprechen.
      PUBLIC_PGP_PUBLIC_KEY_FINGERPRINT: ${PGP_PUBLIC_KEY_FINGERPRINT}
    depends_on: [backend]
    networks: [internal]

  admin-build:
    build:
      context: ../admin
      args:
        PUBLIC_API_BASE_URL: ""
    restart: "no"
    volumes:
      - admin_build:/out
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - admin_build:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend, admin-build]
    networks: [internal]

networks:
  internal:

volumes:
  pg_data:
  backend_uploads:
  admin_build:
  caddy_data:
  caddy_config:

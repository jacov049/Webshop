#!/usr/sbin/nft -f
# CryptoShop — Basis-Firewall (nftables) für den VPS.
# Installation: nach /etc/nftables.conf kopieren, `systemctl enable --now nftables`.
# Passt zur Sicherheits-Checkliste (Konzept Abschnitt 8): minimale offene
# Ports, SSH nur Key-Auth (separat in sshd_config konfigurieren), fail2ban
# ergänzend für Brute-Force-Schutz auf SSH.


# Docker owns forwarding/NAT. Never flush its rules; manage only this named table.
# Reload: nft delete table inet cryptoshop_filter (if present), then nft -f this file.

table inet cryptoshop_filter {
	chain input {
		type filter hook input priority 0; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		# ICMP/ICMPv6 (nur das Nötigste für Diagnose & IPv6-Nachbarschaft)
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
		ip6 nexthdr icmpv6 icmpv6 type {
			echo-request, destination-unreachable, packet-too-big,
			time-exceeded, parameter-problem, nd-neighbor-solicit,
			nd-neighbor-advert, nd-router-solicit, nd-router-advert
		} accept

		# SSH: eigenen Port anpassen, falls von 22 abweichend. Rate-Limiting
		# gegen Brute-Force zusätzlich zu fail2ban.
		tcp dport 22 ct state new limit rate 10/minute accept

		# HTTP/HTTPS (Caddy: Zertifikatsausstellung + eigentlicher Traffic)
		tcp dport { 80, 443 } accept

		# Alles andere verwerfen (inkl. direktem Zugriff auf DB/Backend/
		# Admin-Panel-Ports von außen – diese sind nur im internen
		# Docker-Netzwerk erreichbar und werden hier ohnehin nicht
		# nach außen exponiert).
		counter drop
	}

	# No forward chain: Docker manages published-port forwarding.

	chain output {
		type filter hook output priority 0; policy accept;
	}
}
